<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>地球online · 个人经验工作台</title>
<meta name="theme-color" content="#0B0E14">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon.jpg">
<script src="https://cdn.jsdelivr.net/npm/paho-mqtt@1.1.0/paho-mqtt-min.js"></script>
<style>
  :root{
    --bg:#0B0E14;
    --panel:#121826;
    --text:#E6F1FF;
    --muted:#8aa0b8;
    --accent:#00F0FF;
    --lv:#FFFFFF;
    --glass:rgba(255,255,255,.05);
    --glass-border:rgba(0,240,255,.16);
    --exp-pos:#3DFFA0;
    --exp-pos-shadow:rgba(61,255,160,.5);
    --exp-neg:#FF5C7A;
    --exp-neg-shadow:rgba(255,92,122,.5);
    --shadow:0 6px 22px rgba(0,0,0,.28);
  }
  :root[data-theme="light"]{
    --bg:#F2F5F9;
    --panel:#FFFFFF;
    --text:#0F172A;
    --muted:#475569;
    --accent:#0284C7;
    --glass:rgba(255,255,255,.72);
    --glass-border:rgba(0,0,0,.08);
    --exp-pos:#0F9D58;
    --exp-pos-shadow:rgba(15,157,88,.25);
    --exp-neg:#D93025;
    --exp-neg-shadow:rgba(217,48,37,.25);
    --shadow:0 6px 22px rgba(0,0,0,.1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:radial-gradient(1200px 600px at 80% -10%, rgba(0,240,255,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(124,77,255,.12), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;user-select:none;transition:background .3s,color .3s;
  }
  :root[data-theme="light"] body{
    background:radial-gradient(1200px 600px at 80% -10%, rgba(2,132,199,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 110%, rgba(124,77,255,.08), transparent 60%),
      var(--bg);
  }
  #app{max-width:520px;margin:0 auto;height:100%;position:relative;}

  /* ---------- Top bar ---------- */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:20;max-width:520px;margin:0 auto;
    background:rgba(11,14,20,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    padding:10px 12px 10px;padding-top:calc(10px + env(safe-area-inset-top));
    border-bottom:1px solid var(--glass-border);transition:background .3s,border-color .3s;}
  :root[data-theme="light"] .topbar{background:rgba(255,255,255,.72);}
  .toprow{display:flex;align-items:center;gap:10px;position:relative;}
  .user-chip{display:flex;align-items:center;gap:9px;cursor:pointer;padding:4px 8px 4px 4px;border-radius:30px;transition:background .2s;}
  .user-chip:active{background:rgba(128,128,128,.12);}
  .avatar{width:42px;height:42px;border-radius:50%;background:rgba(128,128,128,.15);background-size:cover;background-position:center;
    border:2px solid var(--lv);box-shadow:0 0 12px color-mix(in srgb, var(--lv) 55%, transparent);
    display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;}
  .nickname{font-weight:700;font-size:15px;max-width:140px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none;color:var(--text);}
  .nickname:focus{text-shadow:none;}
  .net{position:absolute;right:0;top:50%;transform:translateY(-50%);width:10px;height:10px;border-radius:50%;background:#3DFFA0;box-shadow:0 0 8px #3DFFA0;transition:.3s;}
  .net.off{background:#94a3b8;box-shadow:none;}
  :root[data-theme="light"] .net.off{background:#cbd5e1;}

  .datebar-wrap{margin-top:9px;overflow:hidden;}
  .datebar{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:4px 0;scrollbar-width:none;}
  .datebar::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;width:56px;margin:0 5px;height:58px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--glass);border:1px solid rgba(128,128,128,.12);scroll-snap-align:center;cursor:pointer;position:relative;transition:.2s;}
  .chip .d{font-size:15px;font-weight:700;line-height:1;}
  .chip .w{font-size:11px;color:var(--muted);margin-top:5px;}
  .chip.active{background:linear-gradient(160deg, rgba(0,240,255,.22), rgba(124,77,255,.18));border-color:var(--accent);box-shadow:0 0 16px rgba(0,240,255,.35);}
  :root[data-theme="light"] .chip.active{background:linear-gradient(160deg, rgba(2,132,199,.18), rgba(124,77,255,.14));box-shadow:0 0 16px rgba(2,132,199,.35);}
  .chip.active .w{color:var(--accent);}
  .chip .dot{position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--accent);box-shadow:0 0 6px var(--accent);opacity:0;}
  .chip.has .dot{opacity:1;}

  /* ---------- Content ---------- */
  .content{position:absolute;top:0;left:0;right:0;bottom:0;padding:148px 14px 110px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .records{display:flex;flex-direction:column;gap:11px;}
  .rec{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-border);border-radius:16px;
    padding:14px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow);animation:pop .28s ease;}
  @keyframes pop{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .rec .name{font-size:15px;font-weight:600;}
  .rec .time{font-size:11px;color:var(--muted);margin-top:3px;}
  .rec .exp{font-size:19px;font-weight:800;white-space:nowrap;}
  .rec .exp.pos{color:var(--exp-pos);text-shadow:0 0 10px var(--exp-pos-shadow);}
  .rec .exp.neg{color:var(--exp-neg);text-shadow:0 0 10px var(--exp-neg-shadow);}
  .empty{text-align:center;color:var(--muted);margin-top:90px;font-size:14px;line-height:1.9;}
  .empty .em{font-size:40px;display:block;margin-bottom:10px;opacity:.8;}

  /* ---------- FAB ---------- */
  .fab{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);width:64px;height:64px;border-radius:50%;border:none;z-index:35;
    background:linear-gradient(135deg,#00F0FF,#7C4DFF);color:#fff;font-size:36px;font-weight:300;line-height:60px;cursor:pointer;box-shadow:0 0 22px rgba(0,240,255,.55);animation:pulse 2.6s ease-in-out infinite;}
  .fab:active{transform:translateX(-50%) scale(.93);}
  @keyframes pulse{0%,100%{box-shadow:0 0 16px rgba(0,240,255,.5);}50%{box-shadow:0 0 34px rgba(124,77,255,.85);}}

  /* ---------- Sidebar ---------- */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:38;opacity:0;pointer-events:none;transition:opacity .25s;}
  .overlay.show{opacity:1;pointer-events:auto;}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:84%;max-width:330px;z-index:40;
    background:linear-gradient(180deg, rgba(13,18,28,.96), rgba(11,14,20,.98));border-right:1px solid var(--glass-border);
    transform:translateX(-105%);transition:transform .28s cubic-bezier(.4,0,.2,1),background .3s,border-color .3s;padding:30px 20px 24px;display:flex;flex-direction:column;gap:18px;
    padding-top:calc(30px + env(safe-area-inset-top));overflow-y:auto;}
  :root[data-theme="light"] .sidebar{background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(242,245,249,.99));}
  .sidebar.show{transform:none;box-shadow:0 0 50px rgba(0,240,255,.12);}
  .sb-top{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;}
  .sb-avatar{width:96px;height:96px;border-radius:50%;cursor:pointer;background:rgba(128,128,128,.12);background-size:cover;background-position:center;border:3px solid var(--lv);
    box-shadow:0 0 22px color-mix(in srgb, var(--lv) 55%, transparent);display:flex;align-items:center;justify-content:center;font-size:40px;}
  .sb-nick{font-size:22px;font-weight:800;outline:none;max-width:90%;color:var(--text);}
  .sb-nick:focus{text-shadow:none;}
  .sb-total{font-size:13px;color:var(--muted);}
  .sb-total b{color:var(--accent);font-size:16px;}
  .sb-level{background:var(--glass);border:1px solid var(--glass-border);border-radius:16px;padding:14px;}
  .lv-name{font-size:14px;font-weight:700;margin-bottom:9px;}
  .bar{height:14px;border-radius:8px;background:rgba(255,255,255,.09);overflow:hidden;position:relative;}
  :root[data-theme="light"] .bar{background:rgba(0,0,0,.12);}
  .bar-fill{height:100%;width:0;border-radius:8px;position:relative;transition:width .6s cubic-bezier(.4,0,.2,1);}
  .bar-fill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg, transparent 0 16px, rgba(255,255,255,.55) 16px 19px);
    background-size:42px 100%;animation:flow 1.1s linear infinite;mix-blend-mode:screen;}
  @keyframes flow{to{background-position:42px 0;}}
  .lv-text{font-size:12px;color:var(--muted);margin-top:8px;text-align:right;}
  .sb-account{background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:12px 14px;font-size:13px;}
  .sb-account .ac-line{font-weight:700;font-size:14px;}
  .sb-account .ac-sync{color:var(--muted);margin-top:5px;font-size:12px;}
  .sb-actions{display:flex;flex-direction:column;gap:12px;margin-top:auto;}

  /* ---------- Buttons ---------- */
  .btn{border:none;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;transition:.15s;}
  .btn:active{transform:scale(.97);}
  .btn.primary{background:linear-gradient(135deg,#00F0FF,#7C4DFF);color:#04121a;box-shadow:0 0 16px rgba(0,240,255,.4);}
  .btn.ghost{background:rgba(128,128,128,.07);color:var(--text);border:1px solid rgba(128,128,128,.15);}
  :root[data-theme="light"] .btn.ghost{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.12);}
  .btn.danger{background:linear-gradient(135deg,#FF5C7A,#FF2E63);color:#fff;}
  .btn.block{width:100%;}
  .btn-row{display:flex;gap:12px;margin-top:18px;}
  .btn-row .btn{flex:1;}
  .theme-row{display:flex;gap:10px;margin-top:8px;}
  .theme-row .btn{flex:1;}
  .theme-row .btn.sel{background:linear-gradient(135deg,#00F0FF,#7C4DFF);color:#04121a;border-color:transparent;}

  /* ---------- Modals ---------- */
  .modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;}
  .modal.show{display:flex;}
  .modal-back{position:absolute;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);}
  .sheet{position:relative;width:100%;max-width:520px;background:linear-gradient(180deg, rgba(16,22,33,.98), rgba(11,14,20,.99));
    border-top:1px solid var(--glass-border);border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.5);
    animation:slideUp .3s cubic-bezier(.2,.8,.2,1);max-height:92vh;overflow-y:auto;transition:background .3s,border-color .3s;}
  :root[data-theme="light"] .sheet{background:linear-gradient(180deg, rgba(255,255,255,.99), rgba(242,245,249,1));}
  @keyframes slideUp{from{transform:translateY(100%);}to{transform:none;}}
  .sheet h3{margin:0 0 16px;font-size:18px;}
  .sheet h4{margin:18px 0 10px;font-size:14px;color:var(--muted);font-weight:700;}
  .sheet label{display:block;font-size:13px;color:var(--muted);margin:14px 0 7px;}
  .sheet input{width:100%;padding:13px 14px;border-radius:12px;font-size:16px;background:rgba(128,128,128,.06);border:1px solid rgba(128,128,128,.15);color:var(--text);outline:none;}
  :root[data-theme="light"] .sheet input{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.12);}
  .sheet input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,240,255,.15);}

  .modal-head{display:flex;align-items:center;justify-content:space-between;}
  .modal-head .x{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;}

  /* ---------- Statistics ---------- */
  .period-bar{display:flex;align-items:center;gap:8px;margin:6px 0 14px;}
  .period-bar .nav{width:30px;height:30px;border-radius:50%;border:1px solid rgba(128,128,128,.15);background:rgba(128,128,128,.06);color:var(--text);cursor:pointer;font-size:16px;}
  .period-btn{display:flex;align-items:center;gap:6px;background:rgba(0,240,255,.1);border:1px solid rgba(0,240,255,.3);color:var(--accent);
    padding:7px 13px;border-radius:20px;font-weight:700;font-size:14px;cursor:pointer;}
  .period-picker{background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:12px;margin-bottom:14px;}
  .period-picker.hidden{display:none;}
  .pp-year{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px;font-weight:700;}
  .pp-year button{width:30px;height:30px;border-radius:8px;border:1px solid rgba(128,128,128,.15);background:rgba(128,128,128,.06);color:var(--text);cursor:pointer;}
  .pp-months{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .pp-months button{padding:10px 0;border-radius:10px;border:1px solid rgba(128,128,128,.1);background:rgba(128,128,128,.04);color:var(--text);cursor:pointer;font-size:14px;}
  .pp-months button.sel{background:linear-gradient(135deg,#00F0FF,#7C4DFF);color:#04121a;border:none;font-weight:700;}
  .stats-summary{display:flex;gap:12px;margin-bottom:14px;}
  .stats-summary .card{flex:1;background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;padding:14px;text-align:center;}
  .stats-summary .card .v{font-size:22px;font-weight:800;color:var(--accent);}
  .stats-summary .card .k{font-size:12px;color:var(--muted);margin-top:4px;}
  .stats-list{display:flex;flex-direction:column;gap:10px;}
  .s-group{background:var(--glass);border:1px solid var(--glass-border);border-radius:14px;overflow:hidden;}
  .s-group-head{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;cursor:pointer;}
  .s-group-head .gd{font-weight:700;font-size:14px;}
  .s-group-head .gd small{color:var(--muted);font-weight:400;margin-left:6px;}
  .s-group-head .gt{font-weight:800;color:var(--exp-pos);font-size:14px;}
  .s-group-head .chev{color:var(--muted);transition:.2s;margin-left:8px;}
  .s-group.collapsed .chev{transform:rotate(-90deg);}
  .s-group.collapsed .s-items{display:none;}
  .s-items{padding:0 14px 8px;}
  .s-item{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid rgba(128,128,128,.1);}
  .s-item .e{font-weight:600;font-size:14px;}
  .s-item .t{font-size:11px;color:var(--muted);}
  .s-item .v{font-weight:800;font-size:15px;}
  .s-item .v.pos{color:var(--exp-pos);}
  .s-empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;}

  /* ---------- Settings / Profile ---------- */
  .setting-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid rgba(128,128,128,.1);}
  .setting-row:first-of-type{border-top:none;}
  .setting-row .l{font-weight:600;}
  .setting-row .r{color:var(--muted);font-size:13px;text-align:right;}
  .sync-info{font-size:13px;color:var(--muted);line-height:1.6;margin:8px 0 12px;}
  .profile-avatar{width:110px;height:110px;border-radius:50%;margin:0 auto 16px;background:rgba(128,128,128,.12);background-size:cover;background-position:center;border:3px solid var(--lv);
    box-shadow:0 0 22px color-mix(in srgb, var(--lv) 55%, transparent);display:flex;align-items:center;justify-content:center;font-size:50px;cursor:pointer;}
  .profile-tip{text-align:center;font-size:12px;color:var(--muted);margin-bottom:14px;}

  /* ---------- Login ---------- */
  .login{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(800px 500px at 50% -10%, rgba(0,240,255,.12), transparent 60%), var(--bg);transition:background .3s;}
  .login.hidden{display:none;}
  .login-card{width:100%;max-width:340px;background:linear-gradient(180deg, rgba(16,22,33,.96), rgba(11,14,20,.98));border:1px solid var(--glass-border);border-radius:22px;padding:30px 24px;box-shadow:0 20px 60px rgba(0,0,0,.5);text-align:center;transition:background .3s,border-color .3s;}
  :root[data-theme="light"] .login-card{background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(242,245,249,.99));}
  .login-logo{font-size:48px;width:96px;height:96px;border-radius:50%;margin:0 auto 12px;background:url(./icon.jpg) center/cover no-repeat, rgba(128,128,128,.1);border:2px solid var(--accent);box-shadow:0 0 20px rgba(0,240,255,.4);}
  .login-card h2{margin:8px 0 2px;font-size:24px;letter-spacing:1px;}
  .login-card .sub{color:var(--muted);font-size:13px;margin:0 0 22px;}
  .login-card input{margin-bottom:12px;text-align:center;}
  .lg-err{color:#FF5C7A;font-size:13px;min-height:18px;margin-bottom:6px;}
  :root[data-theme="light"] .lg-err{color:#D93025;}
  .login-card .btn{margin-top:8px;}
</style>
</head>
<body>
<div id="app">

  <!-- Top bar -->
  <header class="topbar">
    <div class="toprow">
      <div class="user-chip" id="userChip">
        <div class="avatar" id="topAvatar"></div>
        <span class="nickname" id="topNick" contenteditable="true" spellcheck="false"></span>
      </div>
      <div class="net" id="netDot" title="在线"></div>
    </div>
    <div class="datebar-wrap">
      <div class="datebar" id="dateBar"></div>
    </div>
  </header>

  <!-- Content -->
  <main class="content" id="content">
    <div class="records" id="records"></div>
  </main>

  <!-- FAB -->
  <button class="fab" id="fab">+</button>

  <!-- Sidebar -->
  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="sb-top">
      <div class="sb-avatar" id="sbAvatar"></div>
      <div class="sb-nick" id="sbNick" contenteditable="true" spellcheck="false"></div>
      <div class="sb-total">总经验值 <b id="sbTotal">0</b></div>
    </div>
    <div class="sb-level">
      <div class="lv-name" id="sbLvName">白色等级</div>
      <div class="bar"><div class="bar-fill" id="sbBarFill"></div></div>
      <div class="lv-text" id="sbLvText">0 / 100</div>
    </div>
    <div class="sb-account">
      <div class="ac-line" id="acLine">游客模式</div>
      <div class="ac-sync" id="acSync">本地模式 · 数据仅存本机</div>
    </div>
    <div class="sb-actions">
      <button class="btn primary block" id="statBtn">📊 统计</button>
      <button class="btn ghost block" id="settingsBtn">⚙️ 设置</button>
    </div>
  </aside>

  <!-- Add modal -->
  <div class="modal" id="addModal">
    <div class="modal-back" data-close></div>
    <div class="sheet">
      <h3>添加经验记录</h3>
      <label>事件名称</label>
      <input id="evtName" type="text" placeholder="如：晨跑" maxlength="20">
      <label>经验值（最低 0）</label>
      <input id="evtExp" type="number" min="0" placeholder="如：50" inputmode="numeric">
      <div class="btn-row">
        <button class="btn ghost" id="addCancel">取消</button>
        <button class="btn primary" id="addSave">记录</button>
      </div>
    </div>
  </div>

  <!-- Statistics modal -->
  <div class="modal" id="statsModal">
    <div class="modal-back" data-close></div>
    <div class="sheet">
      <div class="modal-head">
        <h3>📊 经验统计</h3>
        <button class="x" id="statsClose">✕</button>
      </div>
      <div class="period-bar">
        <button class="nav" id="ppPrevM">‹</button>
        <div class="period-btn" id="periodBtn"><span id="periodLabel">2026年7月</span><span>▾</span></div>
        <button class="nav" id="ppNextM">›</button>
      </div>
      <div class="period-picker hidden" id="periodPicker">
        <div class="pp-year">
          <button id="ppPrevY">‹</button><span id="ppYear">2026</span><button id="ppNextY">›</button>
        </div>
        <div class="pp-months" id="ppMonths"></div>
      </div>
      <div class="stats-summary">
        <div class="card"><div class="v" id="sumExp">0</div><div class="k">本月总经验</div></div>
        <div class="card"><div class="v" id="sumCnt">0</div><div class="k">记录条数</div></div>
      </div>
      <div class="stats-list" id="statsList"></div>
    </div>
  </div>

  <!-- Settings modal -->
  <div class="modal" id="settingsModal">
    <div class="modal-back" data-close></div>
    <div class="sheet">
      <div class="modal-head">
        <h3>⚙️ 设置</h3>
        <button class="x" id="settingsClose">✕</button>
      </div>
      <h4>主题模式</h4>
      <div class="theme-row">
        <button class="btn ghost" data-theme="dark" id="themeDark">🌙 深色</button>

  <!-- Login -->
  <div class="login hidden" id="loginScreen">
    <div class="login-card">
      <div class="login-logo"></div>
      <h2>地球online</h2>
      <p class="sub">个人经验工作台</p>
      <input id="lgUser" type="text" placeholder="用户名" maxlength="20" autocomplete="username">
      <input id="lgPw" type="password" placeholder="密码" autocomplete="current-password">

      <button class="btn ghost block" id="lgReg">注册新账号</button>
      <button class="btn ghost block" id="lgGuest">游客体验（仅本机）</button>
    </div>

<script>
  // update theme-color meta on theme change
  (function(){
    const meta=document.querySelector('meta[name="theme-color"]');
    const ro=new MutationObserver(()=>{
      if(!meta) return;
      meta.content=document.documentElement.dataset.theme==="light"?"#F2F5F9":"#0B0E14";
    });
    ro.observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
  })();
  // register service worker for PWA/offline
  if("serviceWorker" in navigator){
    window.addEventListener("load",function(){
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    });
  }
</script>
<script>
(function(){
  "use strict";
  // ============ constants ============
  const LS_ACCOUNTS="eow_accounts_v2";
  const LS_SESSION="eow_session_v2";
  const GUEST="__guest__";
  const WEEK=["周日","周一","周二","周三","周四","周五","周六"];
  const LEVELS=[
    {name:"白色等级",min:0,color:"#FFFFFF"},
    {name:"绿色等级",min:100,color:"#4CAF50"},
    {name:"蓝色等级",min:600,color:"#2196F3"},
    {name:"紫色等级",min:1500,color:"#9C27B0"},
    {name:"黄色等级",min:2500,color:"#FFEB3B"},
    {name:"黑色等级",min:4000,color:"#212121"},
    {name:"粉色等级",min:6000,color:"#E91E63"},
    {name:"橙色等级",min:7500,color:"#FF9800"},
    {name:"红色等级",min:10000,color:"#F44336"}
  ];
  const CHIP_STEP=66;
  const MQTT_BROKER="broker.hivemq.com";
  const MQTT_PORT=8884;
  const MQTT_PATH="/mqtt";

  // ============ storage helpers ============
  function readJSON(k,def){ try{ const r=localStorage.getItem(k); return r?JSON.parse(r):def; }catch(e){ return def; } }
  function writeJSON(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ console.warn(e); } }
  function cyrb53(str,seed=0){ let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;
    for(let i=0;i<str.length;i++){ const ch=str.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
    h1=Math.imul(h1^(h1>>>16),2246822507); h2=Math.imul(h2^(h2>>>13),3266489909);
    return (h2>>>0).toString(16); }

  // ============ encryption (Web Crypto) ============
  async function getCryptoKey(user, pass){
    const enc=new TextEncoder();
    const base=await crypto.subtle.importKey("raw", enc.encode(pass), {name:"PBKDF2"}, false, ["deriveKey"]);
    const salt=enc.encode(user.padEnd(16,'0').slice(0,16));
    return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:100000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
  }
  function ab2b64(buf){ const b=new Uint8Array(buf); let s=''; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
  function b642ab(str){ const s=atob(str); const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return b.buffer; }
  async function encryptPayload(obj,user,pass){
    const key=await getCryptoKey(user,pass);
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const pt=new TextEncoder().encode(JSON.stringify(obj));
    const ct=await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, pt);
    return ab2b64(iv)+":"+ab2b64(ct);
  }
  async function decryptPayload(str,user,pass){
    try{ const p=str.split(":"); if(p.length!==2) return null;
      const key=await getCryptoKey(user,pass); const iv=b642ab(p[0]); const ct=b642ab(p[1]);
      const pt=await crypto.subtle.decrypt({name:"AES-GCM", iv}, key, ct);
      return JSON.parse(new TextDecoder().decode(pt));
    }catch(e){ return null; }
  }

  // ============ account state ============
  let accounts=readJSON(LS_ACCOUNTS,{});
  let curUser=null;
  let data={avatar:null,nickname:"玩家",totalExp:0,records:{},theme:"dark"};
  let booted=false;
  let sessionPassword=null;

  function isRegistered(u){ return u && u!==GUEST && accounts[u] && accounts[u].pw; }
  function defaultData(){ return {avatar:null,nickname:"玩家",totalExp:0,records:{},theme:"dark"}; }

  // ============ MQTT sync engine ============
  let mqttClient=null, mqttConnected=false;
  function mqttTopic(u){ return "eow/"+u.replace(/[^a-zA-Z0-9_-]/g,'_'); }
  function initMQTT(u,p){
    sessionPassword=p;
    if(mqttClient){ try{ mqttClient.disconnect(); }catch(e){} mqttClient=null; }
    const clientId="eow_"+u.replace(/[^a-zA-Z0-9]/g,'_')+"_"+Math.random().toString(36).slice(2,8);
    mqttClient=new Paho.MQTT.Client("wss://"+MQTT_BROKER+":"+MQTT_PORT+MQTT_PATH, clientId);
    mqttClient.onConnectionLost=(resp)=>{ mqttConnected=false; updateSyncUI(); setTimeout(()=>connectMQTT(u,p), 3000); };
    mqttClient.onMessageArrived=(msg)=>handleCloudMessage(msg.payloadString);
    connectMQTT(u,p);
  }
  function connectMQTT(u,p){
    if(!navigator.onLine){ mqttConnected=false; updateSyncUI(); return; }
    mqttClient.connect({ useSSL:true, reconnect:true, timeout:10,
      onSuccess:()=>{ mqttConnected=true; updateSyncUI(); mqttClient.subscribe(mqttTopic(u)); publishSync(); },
      onFailure:()=>{ mqttConnected=false; updateSyncUI(); setTimeout(()=>connectMQTT(u,p), 5000); }
    });
  }
  async function publishSync(){
    if(!mqttClient || !mqttConnected || !isRegistered(curUser) || !sessionPassword) return;
    const payload=await encryptPayload({data:data,updatedAt:Date.now()}, curUser, sessionPassword);
    const msg=new Paho.MQTT.Message(payload);
    msg.destinationName=mqttTopic(curUser);
    msg.qos=1; msg.retained=true;
    mqttClient.send(msg);
  }
  async function handleCloudMessage(payload){
    if(!isRegistered(curUser) || !sessionPassword) return;
    const dec=await decryptPayload(payload, curUser, sessionPassword);
    if(!dec || !dec.data || !dec.updatedAt) return;
    const localUpd=(accounts[curUser]&&accounts[curUser].updatedAt)||0;
    if(dec.updatedAt>localUpd){
      accounts[curUser].data=dec.data; accounts[curUser].updatedAt=dec.updatedAt;
      data=dec.data; writeJSON(LS_ACCOUNTS,accounts);
      applyTheme(data.theme||"dark"); renderAll();
    }
  }

  // ============ persistence ============
  function persistLocal(){
    accounts[curUser]=accounts[curUser]||{};
    accounts[curUser].data=data; accounts[curUser].updatedAt=Date.now();
    writeJSON(LS_ACCOUNTS,accounts);
    if(navigator.onLine && isRegistered(curUser)) publishSync();
  }
  function save(){ persistLocal(); }

  // ============ theme ============
  function applyTheme(t){ data.theme=t; document.documentElement.dataset.theme=t; updateThemeButtons(); applyLevel(); }
  function updateThemeButtons(){
    $("themeDark").classList.toggle("sel", data.theme==="dark");
    $("themeLight").classList.toggle("sel", data.theme==="light");
  }

  // ============ date helpers ============
  function pad(n){ return n<10?"0"+n:""+n; }
  function startOfDay(d){ const r=new Date(d); r.setHours(0,0,0,0); return r; }
  function fmtKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function parseKey(k){ const p=k.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
  function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
  function diffDays(a,b){ return Math.round((startOfDay(a)-startOfDay(b))/86400000); }
  function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function dayTotal(key){ const l=data.records[key]; return l?l.reduce((s,r)=>s+r.exp,0):0; }
  function getLevelInfo(total){
    const t=Math.max(0,total); let idx=0;
    for(let i=0;i<LEVELS.length;i++){ if(t>=LEVELS[i].min) idx=i; }
    const cur=LEVELS[idx], next=LEVELS[idx+1]||null;
    const levelExp=next?next.min:t;
    const progress=next?Math.min(1,t/levelExp):1;
    return {cur,next,levelExp,progress,isMax:!next};
  }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // ============ DOM refs ============
  const $=id=>document.getElementById(id);
  const topAvatar=$("topAvatar"),sbAvatar=$("sbAvatar"),profileAvatar=$("profileAvatar");
  const topNick=$("topNick"),sbNick=$("sbNick"),profileNick=$("profileNick");
  const dateBar=$("dateBar"),recordsEl=$("records"),content=$("content");
  const sidebar=$("sidebar"),overlay=$("overlay");
  const sbLvName=$("sbLvName"),sbLvText=$("sbLvText"),sbBarFill=$("sbBarFill"),sbTotal=$("sbTotal");
  const netDot=$("netDot"),acLine=$("acLine"),acSync=$("acSync");
  const addModal=$("addModal"),statsModal=$("statsModal"),settingsModal=$("settingsModal"),profileModal=$("profileModal"),delModal=$("delModal"),loginScreen=$("loginScreen");
  const avatarInput=$("avatarInput");

  // ============ avatar ============
  function renderAvatar(){
    const ph='<span style="font-size:20px">🛰️</span>';
    const phBig='<span style="font-size:40px">🛰️</span>';
    const phProfile='<span style="font-size:50px">🛰️</span>';
    if(data.avatar){
      const url='url('+JSON.stringify(data.avatar)+')';
      topAvatar.style.backgroundImage=url; sbAvatar.style.backgroundImage=url; profileAvatar.style.backgroundImage=url;
      topAvatar.innerHTML=""; sbAvatar.innerHTML=""; profileAvatar.innerHTML="";
    }else{
      topAvatar.style.backgroundImage="none"; sbAvatar.style.backgroundImage="none"; profileAvatar.style.backgroundImage="none";
      topAvatar.innerHTML=ph; sbAvatar.innerHTML=phBig; profileAvatar.innerHTML=phProfile;
    }
  }
  avatarInput.addEventListener("change",e=>{
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{ data.avatar=reader.result; save(); renderAvatar(); applyLevel(); };
    reader.readAsDataURL(file); avatarInput.value="";
  });

  // ============ nickname ============
  topNick.addEventListener("input",()=>{ data.nickname=topNick.textContent.trim()||"玩家"; sbNick.textContent=data.nickname; save(); });
  sbNick.addEventListener("input",()=>{ data.nickname=sbNick.textContent.trim()||"玩家"; topNick.textContent=data.nickname; save(); });

  // ============ level styling ============
  function applyLevel(){
    const info=getLevelInfo(data.totalExp);
    const c=info.cur.color;
    const isLight=document.documentElement.dataset.theme==="light";
    const glow=isLight ? "0 1px 2px rgba(0,0,0,.35)" : (c==="#212121"?"0 0 6px rgba(255,255,255,.4)":"0 0 10px "+c+"66");
    topNick.style.color=c; topNick.style.textShadow=glow;
    sbNick.style.color=c; sbNick.style.textShadow=glow;
    sbLvName.textContent=info.cur.name; sbLvName.style.color=c; sbLvName.style.textShadow=isLight?"0 1px 2px rgba(0,0,0,.35)":"";
    sbLvText.textContent=info.isMax?(data.totalExp+" (已满级)"):(data.totalExp+" / "+info.levelExp);
    sbBarFill.style.width=(info.progress*100)+"%";
    sbBarFill.style.background=c; sbBarFill.style.boxShadow="0 0 12px "+c;
    sbTotal.textContent=data.totalExp;
    document.documentElement.style.setProperty("--lv",c);
  }

  // ============ date bar ============
  let rangeStart,rangeEnd,selectedDate=startOfDay(new Date()),selectedKey=fmtKey(selectedDate);
  function makeChip(d){
    const key=fmtKey(d);
    const chip=document.createElement("div"); chip.className="chip"; chip.dataset.key=key;
    if(key===selectedKey) chip.classList.add("active");
    if(dayTotal(key)>0) chip.classList.add("has");
    chip.innerHTML='<div class="d">'+pad(d.getMonth()+1)+"/"+pad(d.getDate())+'</div>'+
                   '<div class="w">'+WEEK[d.getDay()].slice(1)+'</div><div class="dot"></div>';
    chip.addEventListener("click",()=>selectDate(key));
    return chip;
  }
  function buildChips(){ dateBar.innerHTML=""; let d=rangeStart; while(d<=rangeEnd){ dateBar.appendChild(makeChip(d)); d=addDays(d,1); } }
  function initDateBar(){ rangeStart=addDays(selectedDate,-120); rangeEnd=addDays(selectedDate,120); buildChips(); scrollToSelected(true); }
  function scrollToSelected(immediate){
    const idx=diffDays(selectedDate,rangeStart);
    const target=idx*CHIP_STEP+28-dateBar.clientWidth/2;
    dateBar.scrollTo({left:Math.max(0,target),behavior:immediate?"auto":"smooth"});
  }
  function updateChipStates(){
    dateBar.querySelectorAll(".chip").forEach(ch=>{
      const k=ch.dataset.key;
      ch.classList.toggle("active",k===selectedKey);
      ch.classList.toggle("has",dayTotal(k)>0);
    });
  }
  dateBar.addEventListener("scroll",()=>{
    if(dateBar.scrollLeft<CHIP_STEP*30){
      const n=60; rangeStart=addDays(rangeStart,-n);
      const frag=document.createDocumentFragment(); let d=rangeStart; for(let i=0;i<n;i++){ frag.appendChild(makeChip(d)); d=addDays(d,1); }
      dateBar.insertBefore(frag,dateBar.firstChild); dateBar.scrollLeft+=n*CHIP_STEP;
    }
    if(dateBar.scrollLeft+dateBar.clientWidth>dateBar.scrollWidth-CHIP_STEP*30){
      const n=60; let d=addDays(rangeEnd,1); for(let i=0;i<n;i++){ dateBar.appendChild(makeChip(d)); d=addDays(d,1); }
      rangeEnd=addDays(rangeEnd,n);
    }
  });
  function selectDate(key){ selectedKey=key; selectedDate=parseKey(key); updateChipStates(); scrollToSelected(false); renderRecords(); }

  // ============ records ============
  function fmtTime(ts){ const d=new Date(ts); return pad(d.getMonth()+1)+"/"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes()); }
  function renderRecords(){
    const list=(data.records[selectedKey]||[]).slice().sort((a,b)=>b.ts-a.ts);
    recordsEl.innerHTML="";
    if(list.length===0){
      const e=document.createElement("div"); e.className="empty";
      e.innerHTML='<span class="em">🌱</span>今天还没有记录，<br>去加点经验吧~';
      recordsEl.appendChild(e); return;
    }
    list.forEach(rec=>{
      const el=document.createElement("div"); el.className="rec";
      const pos=rec.exp>=0;
      el.innerHTML='<div><div class="name">'+escapeHtml(rec.name)+'</div><div class="time">'+fmtTime(rec.ts)+'</div></div>'+
                   '<div class="exp '+(pos?"pos":"neg")+'">'+(pos?"+":"")+rec.exp+'</div>';
      bindLongPress(el,rec); recordsEl.appendChild(el);
    });
  }

  // ============ long press delete ============
  let lpTimer=null,pendingDelete=null;
  function bindLongPress(el,rec){
    el.addEventListener("pointerdown",()=>{ lpTimer=setTimeout(()=>{ lpTimer=null; openDelete(rec); },550); });
    const cancel=()=>{ if(lpTimer){clearTimeout(lpTimer); lpTimer=null;} };
    el.addEventListener("pointerup",cancel); el.addEventListener("pointerleave",cancel); el.addEventListener("pointercancel",cancel);
  }
  function openDelete(rec){
    pendingDelete=rec;
    $("delInfo").innerHTML="事件：<b>"+escapeHtml(rec.name)+"</b><br>经验值："+(rec.exp>=0?"+":"")+rec.exp+"<br><br>删除后将从当日与总计中扣除对应经验。";
    showModal(delModal); if(navigator.vibrate) navigator.vibrate(30);
  }
  $("delConfirm").addEventListener("click",()=>{
    if(!pendingDelete) return;
    const list=data.records[selectedKey];
    if(list){ const i=list.findIndex(r=>r.id===pendingDelete.id);
      if(i>=0){ data.totalExp=Math.max(0,data.totalExp-list[i].exp); list.splice(i,1); if(list.length===0) delete data.records[selectedKey]; } }
    pendingDelete=null; save(); hideModal(delModal); renderRecords(); applyLevel(); updateChipStates();
  });

  // ============ add record ============
  function openAdd(){ $("evtName").value=""; $("evtExp").value=""; showModal(addModal); setTimeout(()=>$("evtName").focus(),250); }
  $("addSave").addEventListener("click",()=>{
    const name=($("evtName").value.trim())||"未命名";
    let exp=parseInt($("evtExp").value,10); if(isNaN(exp)) exp=0; if(exp<0) exp=0;
    if(!data.records[selectedKey]) data.records[selectedKey]=[];
    data.records[selectedKey].push({id:uid(),name,exp,ts:Date.now()});
    data.totalExp+=exp; save(); hideModal(addModal);
    renderRecords(); applyLevel(); updateChipStates();
    content.scrollTo({top:0,behavior:"smooth"});
  });

  // ============ statistics ============
  let statsYear=new Date().getFullYear(), statsMonth=new Date().getMonth()+1;
  function openStats(){ statsYear=selectedDate.getFullYear(); statsMonth=selectedDate.getMonth()+1; $("periodPicker").classList.add("hidden"); renderStats(); showModal(statsModal); }
  function renderStats(){
    $("periodLabel").textContent=statsYear+"年"+statsMonth+"月";
    const inMonth=[];
    for(const key in data.records){ const p=key.split("-"); if(+p[0]===statsYear && +p[1]===statsMonth) data.records[key].forEach(r=>inMonth.push({key,r})); }
    const total=inMonth.reduce((s,x)=>s+x.r.exp,0);
    $("sumExp").textContent=total; $("sumCnt").textContent=inMonth.length;
    const groups={}; inMonth.forEach(x=>{ (groups[x.key]=groups[x.key]||[]).push(x.r); });
    const keys=Object.keys(groups).sort((a,b)=>b.localeCompare(a));
    const box=$("statsList"); box.innerHTML="";
    if(keys.length===0){ box.innerHTML='<div class="s-empty">本月还没有经验记录<br>去加点经验吧~</div>'; return; }
    keys.forEach(k=>{
      const d=parseKey(k); const items=groups[k].slice().sort((a,b)=>b.ts-a.ts); const dt=items.reduce((s,r)=>s+r.exp,0);
      const g=document.createElement("div"); g.className="s-group";
      const head=document.createElement("div"); head.className="s-group-head";
      head.innerHTML='<div class="gd">'+pad(d.getMonth()+1)+"/"+pad(d.getDate())+'<small>'+WEEK[d.getDay()]+'</small></div>'+
                     '<div><span class="gt">+'+dt+'</span><span class="chev">▾</span></div>';
      const body=document.createElement("div"); body.className="s-items";
      items.forEach(r=>{ const it=document.createElement("div"); it.className="s-item";
        it.innerHTML='<div><div class="e">'+escapeHtml(r.name)+'</div><div class="t">'+fmtTime(r.ts)+'</div></div>'+
                    '<div class="v '+(r.exp>=0?"pos":"")+'">'+(r.exp>=0?"+":"")+r.exp+'</div>'; body.appendChild(it); });
      head.addEventListener("click",()=>g.classList.toggle("collapsed")); g.appendChild(head); g.appendChild(body); box.appendChild(g);
    });
  }
  function shiftMonth(delta){ statsMonth+=delta; if(statsMonth<1){statsMonth=12;statsYear--;} if(statsMonth>12){statsMonth=1;statsYear++;} renderStats(); }
  $("ppPrevM").addEventListener("click",()=>shiftMonth(-1));
  $("ppNextM").addEventListener("click",()=>shiftMonth(1));
  $("periodBtn").addEventListener("click",()=>{ const pk=$("periodPicker"); pk.classList.toggle("hidden"); if(!pk.classList.contains("hidden")) renderPeriodPicker(); });
  $("ppPrevY").addEventListener("click",()=>{ statsYear--; renderPeriodPicker(); });
  $("ppNextY").addEventListener("click",()=>{ statsYear++; renderPeriodPicker(); });
  function renderPeriodPicker(){
    $("ppYear").textContent=statsYear; const m=$("ppMonths"); m.innerHTML="";
    for(let i=1;i<=12;i++){ const b=document.createElement("button"); b.textContent=i+"月"; if(i===statsMonth) b.classList.add("sel");
      b.addEventListener("click",()=>{ statsMonth=i; $("periodPicker").classList.add("hidden"); renderStats(); }); m.appendChild(b); }
  }

  // ============ settings ============
  function openSettings(){ updateSyncUI(); showModal(settingsModal); }
  function updateSyncUI(){
    const on=navigator.onLine;
    if(isRegistered(curUser)){
      $("syncInfo").textContent=mqttConnected
        ? "☁ 已连接云端（"+MQTT_BROKER+"）。数据改动会自动同步到登录同一账号的设备。"
        : (on?"正在连接云端…":"⚠ 当前离线，改动已存本机，联网后自动同步。");
      $("syncNow").style.display="block";
    }else{
      $("syncInfo").textContent="游客模式：数据仅存本机。注册并登录账号后即可启用跨设备云同步。";
      $("syncNow").style.display="none";
    }
  }
  $("syncNow").addEventListener("click",()=>{ if(isRegistered(curUser)) publishSync(); });
  $("themeDark").addEventListener("click",()=>{ applyTheme("dark"); save(); });
  $("themeLight").addEventListener("click",()=>{ applyTheme("light"); save(); });
  $("settingsLogout").addEventListener("click",()=>{
    try{ localStorage.setItem(LS_SESSION,""); }catch(e){}
    if(mqttClient){ try{ mqttClient.disconnect(); }catch(e){} mqttClient=null; mqttConnected=false; }
    curUser=null; sessionPassword=null; hideModal(settingsModal); showLogin();
  });

  // ============ profile ============
  function openProfile(){ profileNick.value=data.nickname||""; renderAvatar(); showModal(profileModal); }
  profileAvatar.addEventListener("click",()=>avatarInput.click());
  $("profileSave").addEventListener("click",()=>{
    const nick=(profileNick.value.trim())||"玩家";
    data.nickname=nick; topNick.textContent=nick; sbNick.textContent=nick;
    save(); hideModal(profileModal); applyLevel();
  });

  // ============ modals / sidebar ============
  function showModal(m){ m.classList.add("show"); }
  function hideModal(m){ m.classList.remove("show"); }
  function openSidebar(){ sidebar.classList.add("show"); overlay.classList.add("show"); }
  function closeSidebar(){ sidebar.classList.remove("show"); overlay.classList.remove("show"); }

  $("userChip").addEventListener("click",openSidebar);
  overlay.addEventListener("click",closeSidebar);
  $("fab").addEventListener("click",openAdd);
  $("addCancel").addEventListener("click",()=>hideModal(addModal));
  $("statBtn").addEventListener("click",()=>{ closeSidebar(); openStats(); });
  $("settingsBtn").addEventListener("click",()=>{ closeSidebar(); openSettings(); });
  sbAvatar.addEventListener("click",()=>{ closeSidebar(); openProfile(); });
  $("statsClose").addEventListener("click",()=>hideModal(statsModal));
  $("settingsClose").addEventListener("click",()=>hideModal(settingsModal));
  $("profileClose").addEventListener("click",()=>hideModal(profileModal));
  $("delCancel").addEventListener("click",()=>{ pendingDelete=null; hideModal(delModal); });
  document.querySelectorAll("[data-close]").forEach(el=>el.addEventListener("click",()=>{
    hideModal(addModal); hideModal(statsModal); hideModal(settingsModal); hideModal(profileModal); hideModal(delModal); closeSidebar();
  }));

  // ============ network / account UI ============
  function updateNet(){
    const on=navigator.onLine;
    netDot.classList.toggle("off",!on); netDot.title=on?"在线":"离线";
    if(isRegistered(curUser)){
      acSync.textContent=mqttConnected?"☁ 已连接云端":(on?"正在连接云端…":"⚠ 离线 · 已本地保存");
    }else{ acSync.textContent="本地模式 · 数据仅存本机"; }
  }
  function updateAccountUI(){
    acLine.textContent=isRegistered(curUser)?("账号："+curUser):"游客模式";
    updateNet(); updateSyncUI();
  }

  // ============ login ============
  function showLogin(){ loginScreen.classList.remove("hidden"); $("lgErr").textContent=""; }
  function hideLogin(){ loginScreen.classList.add("hidden"); }
  async function doLogin(u, rawPass){
    curUser=u; try{ localStorage.setItem(LS_SESSION,u); }catch(e){}
    const acc=accounts[curUser]; data=(acc&&acc.data)?acc.data:defaultData();
    applyTheme(data.theme||"dark");
    if(!booted) initApp(); else renderAll();
    hideLogin();
    if(isRegistered(curUser) && rawPass) initMQTT(curUser, rawPass);
    updateAccountUI();
  }
  $("lgLogin").addEventListener("click",()=>{
    const u=$("lgUser").value.trim(), p=$("lgPw").value;
    if(!u||!p){ $("lgErr").textContent="请输入用户名和密码"; return; }
    const acc=accounts[u];
    if(!acc||!acc.pw){ $("lgErr").textContent="账号不存在，请先注册"; return; }
    if(acc.pw!==cyrb53(p)){ $("lgErr").textContent="密码错误"; return; }
    doLogin(u,p);
  });
  $("lgReg").addEventListener("click",()=>{
    const u=$("lgUser").value.trim(), p=$("lgPw").value;
    if(!u||!p){ $("lgErr").textContent="用户名和密码均不能为空"; return; }
    if(accounts[u]&&accounts[u].pw){ $("lgErr").textContent="该用户名已被注册"; return; }
    accounts[u]={pw:cyrb53(p),data:defaultData(),updatedAt:0};
    writeJSON(LS_ACCOUNTS,accounts);
    doLogin(u,p);
  });
  $("lgGuest").addEventListener("click",()=>doLogin(GUEST,null));

  // ============ render all ============
  function renderAll(){ renderAvatar(); applyLevel(); renderRecords(); updateChipStates(); updateAccountUI(); updateThemeButtons(); }

  // ============ init ============
  function initApp(){
    booted=true;
    topNick.textContent=data.nickname; sbNick.textContent=data.nickname;
    renderAll(); initDateBar();
    window.addEventListener("online",()=>{ updateNet(); if(isRegistered(curUser) && sessionPassword) connectMQTT(curUser,sessionPassword); });
    window.addEventListener("offline",()=>{ updateNet(); });
  }

  // boot
  (function boot(){
    const sess=localStorage.getItem(LS_SESSION);
    if(sess && accounts[sess]){
      curUser=sess; const acc=accounts[curUser]; data=(acc&&acc.data)?acc.data:defaultData();
      applyTheme(data.theme||"dark"); initApp();
    }else{ showLogin(); }
  })();
})();
</script>
</body>
</html>
